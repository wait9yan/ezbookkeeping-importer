[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "ezbookkeeping-importer"
version = "0.2.1"
description = "招商银行邮件导入与核对服务"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.2",
    "beautifulsoup4==4.14.3",
    "rich==15.0.0",
]

[project.scripts]
ebki = "ezbookkeeping_importer.entrypoints.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.14.14", "mypy==1.19.1", "build==1.4.0"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["src/ezbookkeeping_importer"]

[tool.hatch.build.targets.sdist]
include = ["/hatch_build.py", "/src", "/tests", "/migrations", "/docs", "/scripts", "/docker", "/README.md", "/pyproject.toml", "/uv.lock", "/Dockerfile", "/compose.yaml", "/compose.build.yaml", "/.env.example", "/.dockerignore", "/run"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
