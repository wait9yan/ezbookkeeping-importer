# 复制为 config.toml，按现有账本和历史账户情况逐项填写。
# 本文件只保存业务规则；服务连接和运行参数见 .env.example。
# 本地启动使用 uv run --env-file .env ebki --config config.toml ...。
# 旧版连接/目录/日志字段写在这里会明确报错并提示对应环境变量。

# 必须明确确认银行日报显示时间的时区；此处展示已规划的上海时区。
timezone = "Asia/Shanghai"
# 仅日期还款通知的记账时间尚需用户确认；确认后取消注释并填写。
# 这是记账约定，不能描述为银行真实扣款时刻。
# date_only_time = "12:00:00"

# 先完成来源、映射、历史余额与跨渠道边界核对，再显式启用写入。
writes_enabled = false
historical_boundary_reviewed = false
refund_ownership_confirmed = false
repayment_ownership_confirmed = false

# 手工接纳适用于本地导入和认证不足的历史邮件。
source_policy = "manual_acceptance"
# 若选用 qq_authentication_results，须先确认生产 QQ 接收链与可信认证头。
# source_policy = "qq_authentication_results"
# trusted_authserv_id = "mx.qq.com"
# 认证服务固定 mx.qq.com；顶层 Received 收件主机独立校验 qq.com 域边界。

# 若明确只使用规则分类，可改成 rules_only；AI缺少配置不会冒充有效unmatched。
classification_mode = "ai"

[mail]
# 同一逻辑邮箱保持 source_id 稳定，避免破坏采集位置身份。
source_id = "qq-primary"

# 消费账户从 ezBookkeeping 账户描述（comment）中的银行卡号自动匹配。
# 支持 12–19 位完整卡号，可用空格或连字符分组；邮件仅有尾号时匹配末四位。
# 仅选择可见、可记账且币种与邮件原币一致的账户；必须唯一匹配。
# 不配置 [[accounts]]，不自动跨币种换算。美元消费需要同一卡号的 USD 子账户。
# 账户描述或币种变化不自动重写已经生成的决定。

# 还款邮件没有账户尾号，必须按历史生效区间配置唯一付款/信用卡账户对。
# 分类必须为可用二级转账分类。还需确认 date_only_time 和还款渠道归属。
# [[repayments]]
# source_account_id = "YOUR_PAYMENT_ACCOUNT_ID"
# destination_account_id = "YOUR_CREDIT_ACCOUNT_ID"
# category_id = "YOUR_TRANSFER_CATEGORY_ID"
# currency = "CNY"
# valid_from = 2020-01-01

# 规则使用 Python 正则；同一商户命中不同分类会形成异常。
# [[rules]]
# merchant_pattern = "已确认商户名称"
# category_id = "YOUR_EXPENSE_SUBCATEGORY_ID"
