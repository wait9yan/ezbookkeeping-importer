# 配置文件
# 本文件保存业务规则和日志级别；服务连接参数见 .env.example。
# 复制到 data/config.toml；本地启动使用 ./run 或 uv run --env-file .env ebki ...。

# 日志级别：DEBUG / INFO / WARNING / ERROR / CRITICAL；修改后重启进程。
log_level = "INFO"

# 时区
timezone = "Asia/Shanghai"
# 没有明确记账时间，采用的默认时间（日期还款通知）
date_only_time = "12:00:00"

# run 自动写入通过校验与查重的交易，退款按负支出处理。
repayment_ownership_confirmed = false

# 分类规则：ai\rules_only
classification_mode = "ai"

[mail]
# 首次全量扫描；后续 UID 增量，并在跨日时回扫最近 N 天；0 禁用回扫。
rescan_days = 7
# 同一逻辑邮箱保持 source_id 稳定，避免破坏采集位置身份。
source_id = "qq-primary"

# 消费账户从 ezBookkeeping 账户描述（comment）中的银行卡号自动匹配。
# 支持 12–19 位完整卡号，可用空格或连字符分组；邮件仅有尾号时匹配末四位。
# 仅选择可见、可记账且币种与邮件原币一致的账户；必须唯一匹配。
# 首次入账不自动跨币种换算。美元消费需要同一卡号的 USD 子账户。
# 账户描述或币种变化不自动重写已经生成的决定。

# 还款邮件没有账户尾号，必须按历史生效区间配置唯一付款/信用卡账户对。
# 分类必须为可用二级转账分类。还需确认 date_only_time 和还款渠道归属。
# [[repayments]]
# source_account_id = "YOUR_PAYMENT_ACCOUNT_ID"
# destination_account_id = "YOUR_CREDIT_ACCOUNT_ID"
# category_id = "YOUR_TRANSFER_CATEGORY_ID"
# currency = "CNY"
# valid_from = 2020-01-01

# 规则使用 Python 正则；同一商户命中不同分类会形成异常。
# [[rules]]
# merchant_pattern = "已确认商户名称"
# category_id = "YOUR_EXPENSE_SUBCATEGORY_ID"
