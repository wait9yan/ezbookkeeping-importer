services:
  importer:
    image: "${EBKI_IMAGE:-ghcr.io/wait9yan/ezbookkeeping-importer:latest}"
    restart: unless-stopped
    environment:
      # 必需项由应用按命令检查；migrate 不应要求邮箱或模型凭据。
      EBKI_DATABASE_URL: "${EBKI_DATABASE_URL-}"
      EBKI_LEDGER_URL: "${EBKI_LEDGER_URL-}"
      EBKI_LEDGER_TOKEN: "${EBKI_LEDGER_TOKEN-}"
      EBKI_AI_URL: "${EBKI_AI_URL-}"
      EBKI_AI_MODEL: "${EBKI_AI_MODEL-}"
      EBKI_AI_TOKEN: "${EBKI_AI_TOKEN-}"
      EBKI_IMAP_HOST: "${EBKI_IMAP_HOST-imap.qq.com}"
      EBKI_IMAP_PORT: "${EBKI_IMAP_PORT-993}"
      EBKI_IMAP_USERNAME: "${EBKI_IMAP_USERNAME-}"
      EBKI_IMAP_PASSWORD: "${EBKI_IMAP_PASSWORD-}"
    volumes:
      - ./data:/app/data
    networks:
      - ezbookkeeping
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

networks:
  ezbookkeeping:
    external: true
    name: "ezbookkeeping"
