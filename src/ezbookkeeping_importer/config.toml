# 配置文件
# 本文件保存业务规则和日志级别；服务连接参数见 .env.example。
# 所有 CLI 入口在默认配置缺失时自动写入 data/config.toml，已有配置保持原样。

# 日志级别：DEBUG / INFO / WARNING / ERROR / CRITICAL；修改后重启进程。
log_level = "INFO"

# 时区
timezone = "Asia/Shanghai"

# 分类规则：ai\rules_only
classification_mode = "ai"

[mail]
# 首次全量扫描；后续 UID 增量，并在跨日时回扫最近 N 天；0 禁用回扫。
rescan_days = 7
# 同一逻辑邮箱保持 source_id 稳定，避免破坏采集位置身份。
source_id = "qq-primary"

# 消费账户从 ezBookkeeping 账户描述（comment）中的银行卡号自动匹配。
# 支持 12–19 位完整卡号，可用空格或连字符分组；邮件仅有尾号时匹配末四位。
# 仅选择可见、可记账且币种与邮件原币一致的账户；必须唯一匹配。
# 首次入账不自动跨币种换算。美元消费需要同一卡号的 USD 子账户。
# 账户描述或币种变化不自动重写已经生成的决定。

# 规则使用 Python 正则；同一商户命中不同分类会形成异常。
# [[rules]]
# merchant_pattern = "已确认商户名称"
# category_id = "YOUR_EXPENSE_SUBCATEGORY_ID"
